# Dokploy Compose — API + bot. No public ports. No WAHA service.
# Traefik: /api → api:3000, /wa-hook → bot:3001. Volume acopio_data only.
services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      PORT: "3000"
      SQLITE_PATH: /data/acopio.sqlite
      TRUST_PROXY: "1"
      WHATSAPP_PUBLIC_NUMBER: ${WHATSAPP_PUBLIC_NUMBER}
    volumes:
      - acopio_data:/data
    expose:
      - "3000"
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      PORT: "3001"
      API_BASE: http://api:3000
      PUBLIC_WEB: https://insumos.vowtech.lat
      WAHA_BASE: https://waha.vowtech.lat
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_SESSION: ${WAHA_SESSION}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      LLM_PROVIDER: minimax
      LLM_BASE_URL: https://api.minimax.io/v1
      LLM_MODEL: MiniMax-M3
      LLM_API_KEY: ${LLM_API_KEY}
    expose:
      - "3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  acopio_data:
