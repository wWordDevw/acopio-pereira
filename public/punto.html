<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b34116" />
    <title>Punto — Acopio Pereira</title>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <main class="wrap">
      <a class="nav-back" href="/">← Mapa</a>
      <p class="brand">Acopio Pereira</p>
      <h1 id="nombre">Punto</h1>
      <p id="nota" class="lede"></p>
      <p id="meta" class="meta"></p>
      <h2>Hay ahora</h2>
      <ul id="stock" class="stock"></ul>
      <div id="toggle" class="toggle">
        <button type="button" class="btn is-on" id="btn-entra">Entra</button>
        <button type="button" class="btn" id="btn-sale">Sale</button>
      </div>
      <p class="hint">Un toque suma o resta 1. +5 al lado. O dicta.</p>
      <div id="cats" class="cats"></div>
      <button type="button" class="btn btn-primary btn-mic" id="mic">
        Decir el producto
      </button>
      <p id="mic-hint" class="hint"></p>
      <p id="status" class="status"></p>
      <h2>Últimos movimientos</h2>
      <ul id="movs" class="mov"></ul>
    </main>
    <script type="module" src="/js/punto.js"></script>
  </body>
</html>
