<!DOCTYPE html>
<html lang="es-CO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b34116" />
    <title>Sin red — Acopio Pereira</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <main class="wrap">
      <p class="brand">Acopio Pereira</p>
      <h1>Sin conexión</h1>
      <p class="lede">
        El mapa y el inventario viven en el servidor. Cuando haya señal, recarga.
      </p>
      <button type="button" class="btn btn-primary" id="retry">Reintentar</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", () => {
        location.reload();
      });
    </script>
  </body>
</html>
