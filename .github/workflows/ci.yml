# PR gate only. Deploy stays on Dokploy — this workflow must not touch prod.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  test-api:
    name: test-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install and test
        working-directory: api
        run: |
          npm ci
          npm test

  test-bot:
    name: test-bot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # No package-lock / npm deps. Tests import api/src (parse-voz, categorias).
      - name: Test
        working-directory: bot
        run: npm test

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose files
        env:
          # Interpolation only — compose is not started in CI.
          WHATSAPP_PUBLIC_NUMBER: "0"
          WAHA_API_KEY: dummy
          WAHA_SESSION: dummy
          WEBHOOK_SECRET: dummy
          LLM_API_KEY: dummy
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build api image
        run: docker build --pull -t insumos-api:ci ./api

      - name: Build bot image
        run: docker build --pull -f bot/Dockerfile -t insumos-bot:ci .

  # Single required check for branch protection. Fails if any upstream job did.
  ci:
    name: ci
    if: always()
    needs: [test-api, test-bot, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "needs=$RESULTS"
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*|*,skipped,*) exit 1 ;;
          esac
